<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baskcetball Counter</title>
  <link rel="stylesheet" href="baskcetballCounter.css">
</head>
<body>
  <main>

  <div class="home">
    <h1>HOME</h1>
    <div class="counter">
      <p id="countH">0</p>
    </div>
    <button onclick="addH(1)">+1</button>
    <button onclick="addH(2)">+2</button>
    <button onclick="addH(3)">+3</button>
  </div>

  <div class="guest">
    <h1>GUEST</h1>
    <div class="counter">
      <p id="countG">0</p>
    </div>
    <button onclick="addG(1)">+1</button>
    <button onclick="addG(2)">+2</button>
    <button onclick="addG(3)">+3</button>
  </div>

</main>

<script src="baskcetballCounter.js"></script>
</body>
</html>
